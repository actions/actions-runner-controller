name: (gha) Validate Helm Charts

on:
  pull_request:
    branches:
      - master
    paths:
      - "charts/**"
      - ".github/workflows/gha-validate-chart.yaml"
      - "!charts/actions-runner-controller/**"
      - "!**.md"
  push:
    paths:
      - "charts/**"
      - ".github/workflows/gha-validate-chart.yaml"
      - "!charts/actions-runner-controller/**"
      - "!**.md"
  workflow_dispatch:
env:
  KUBE_SCORE_VERSION: 1.16.1
  HELM_VERSION: v4.2.2
  HELM_UNITTEST_VERSION: 1.1.2

permissions:
  contents: read

concurrency:
  # This will make sure we only apply the concurrency limits on pull requests
  # but not pushes to master branch by making the concurrency group name unique
  # for pushes
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-chart:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: ${{ env.HELM_VERSION }}

      # python is a requirement for the chart-testing action below (supports yamllint among other tests)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          ct version
          changed=$(ct list-changed --config charts/.ci/ct-config-gha.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "changed_charts<<EOF" >> $GITHUB_OUTPUT
          echo "$changed" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run chart-testing (lint)
        run: |
          ct lint --config charts/.ci/ct-config-gha.yaml

  test-chart:
    name: Test Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: ${{ env.HELM_VERSION }}

      # python is a requirement for the chart-testing action below (supports yamllint among other tests)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          ct version
          changed=$(ct list-changed --config charts/.ci/ct-config-gha.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "changed_charts<<EOF" >> $GITHUB_OUTPUT
          echo "$changed" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install helm-unittest
        run: |
          # Pin the upstream signing key independently of the release download.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/helm-unittest/helm-unittest/33c48cac798e465deda9a66c8e6c07c0973cf53d/public-key.asc \
            --output "${RUNNER_TEMP}/helm-unittest-key.asc"
          gpg --batch --yes --dearmor \
            --output "${RUNNER_TEMP}/helm-unittest-keyring.gpg" \
            "${RUNNER_TEMP}/helm-unittest-key.asc"
          helm plugin install \
            "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/unittest-${HELM_UNITTEST_VERSION}.tgz" \
            --verify \
            --keyring "${RUNNER_TEMP}/helm-unittest-keyring.gpg"

      - name: Run helm-unittest (gha-runner-scale-set-controller-experimental)
        run: |
          helm unittest ./charts/gha-runner-scale-set-controller-experimental/

      - name: Run helm-unittest (gha-runner-scale-set-experimental)
        run: |
          helm unittest ./charts/gha-runner-scale-set-experimental/

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Test gha-runner-scale-set
        run: go test ./charts/gha-runner-scale-set/...

      - name: Test gha-runner-scale-set-controller
        run: go test ./charts/gha-runner-scale-set-controller/...

      - name: Test gha-runner-scale-set-experimental
        run: go test ./charts/gha-runner-scale-set-experimental/...
