suite: "Controller Deployment args"
templates:
  - deployment.yaml
tests:
  - it: should include metrics-disabled flags by default
    release:
      name: "test-arc"
      namespace: "test-ns"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--metrics-addr=0"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--listener-metrics-addr=0"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--listener-metrics-endpoint="

  - it: should include watch-single-namespace flag when configured
    set:
      controller:
        manager:
          config:
            watchSingleNamespace: "demo"
    release:
      name: "test-arc"
      namespace: "test-ns"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--watch-single-namespace=demo"

  - it: should include exclude-label-propagation-prefix flags when configured
    set:
      controller:
        manager:
          config:
            excludeLabelPropagationPrefixes:
              - "prefix.com/"
              - "complete.io/label"
    release:
      name: "test-arc"
      namespace: "test-ns"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--exclude-label-propagation-prefix=prefix.com/"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--exclude-label-propagation-prefix=complete.io/label"

  - it: should render metrics port when metrics are enabled
    set:
      controller:
        metrics:
          controllerManagerAddr: ":8080"
          listenerAddr: ":8081"
          listenerEndpoint: "/metrics"
    release:
      name: "test-arc"
      namespace: "test-ns"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--metrics-addr=:8080"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--listener-metrics-addr=:8081"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--listener-metrics-endpoint=/metrics"

  - it: should include runner-max-concurrent-reconciles flag by default and omit listener and scale set flags
    release:
      name: "test-arc"
      namespace: "test-ns"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--runner-max-concurrent-reconciles=2"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--listener-max-concurrent-reconciles=1"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--scale-set-max-concurrent-reconciles=1"

  - it: should include listener and scale set max-concurrent-reconciles flags when configured
    set:
      controller:
        manager:
          config:
            runnerMaxConcurrentReconciles: 20
            listenerMaxConcurrentReconciles: 5
            scaleSetMaxConcurrentReconciles: 3
    release:
      name: "test-arc"
      namespace: "test-ns"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--runner-max-concurrent-reconciles=20"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--listener-max-concurrent-reconciles=5"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--scale-set-max-concurrent-reconciles=3"
