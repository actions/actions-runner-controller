githubConfigUrl: https://github.com/actions/actions-runner-controller
githubConfigSecret:
  github_token: test
template:
  spec:
    containers:
    - name: runner
      image: my-custom-runner-image:latest
      resources:
        limits:
          memory: "2Gi"
        requests:
          cpu: "50m"
          memory: "50Mi"
