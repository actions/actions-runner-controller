githubConfigUrl: https://github.com/actions/actions-runner-controller
githubConfigSecret:
  github_token: test
template:
  spec:
    containers:
    - name: runner
      image: runner-image:latest
      resources:
        requests:
          cpu: "500m"
        limits:
          memory: "512Mi"
    - name: dind
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "200m"
containerMode:
  type: dind
